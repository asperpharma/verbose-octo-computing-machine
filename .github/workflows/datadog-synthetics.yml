name: Datadog Synthetics CI

# This workflow runs Datadog Synthetic tests to monitor the application.
# To use this workflow:
# 1. Configure DATADOG_API_KEY and DATADOG_APP_KEY secrets in GitHub repository settings
# 2. Create synthetic tests in Datadog (https://app.datadoghq.com/synthetics/tests)
# 3. Either:
#    - Add test public IDs to the workflow with the public-ids parameter, OR
#    - Create a *.synthetics.json file in the repository with test configuration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run tests every hour
    - cron: '0 * * * *'

jobs:
  synthetics:
    runs-on: ubuntu-latest
    name: Run Datadog Synthetic Tests
    # Skip the job if the secrets are not configured
    if: ${{ secrets.DATADOG_API_KEY != null && secrets.DATADOG_APP_KEY != null }}
    permissions:
      contents: read
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Datadog Synthetic tests
        uses: DataDog/synthetics-ci-github-action@v3.8.2
        with:
          api-key: ${{ secrets.DATADOG_API_KEY }}
          app-key: ${{ secrets.DATADOG_APP_KEY }}
          # Optional: specify test IDs to run (one per line)
          # public-ids: |
          #   abc-d3f-ghi
          #   jkl-mn0-pqr
          # Optional: configure test locations
          # locations: 'aws:us-east-1, aws:eu-west-1'
          # Optional: set test configuration override
          # config-path: datadog-ci.json
          # Don't fail on missing tests (allows workflow to succeed even without configured tests)
          fail-on-missing-tests: false
          # Optional: subdomain (default: app)
          subdomain: app

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datadog-synthetics-results
          path: .datadog-ci/
